[palettes.warm_accessible]
p_start    = "#9F7887" # muted dusty rose
p_start_1  = "#947A82"
p_mid      = "#8F9F78" # muted sage
p_mid_1    = "#8A9278"
p_end      = "#B77A4F" # muted warm orange
p_end_1    = "#A8744F"
p_cyan     = "#7FA8A8" # muted blue-green
p_cyan_1   = "#789292"
p_amber    = "#B89A68" # muted warm amber
p_amber_1  = "#9A815D"
p_bg_dark  = "#1a1a1a" # neutral near-black (was "warm dark brown" #241919)
p_fg       = "#F1E9DF" # warm light foreground

# Grayscale variant -- same slot names, so every format string above is
# untouched. Shades are waybar's style.xray.css zones verbatim, and identical
# to wezterm.lua's p_xray table. Not the ground truth for either (that is
# wezterm.lua); kept in sync by hand, like the warm palette above.
[palettes.xray]
p_start    = "#6E6E6E" # zone 1
p_start_1  = "#5C5C5C" # zone 1 dim
p_mid      = "#8F8F8F" # zone 2
p_mid_1    = "#7A7A7A" # zone 2 dim
p_end      = "#F0F0F0" # zone 4 -- near-white, the brightest segment
p_end_1    = "#D4D4D4" # zone 4 dim
p_cyan     = "#B8B8B8" # zone 3
p_cyan_1   = "#A0A0A0" # zone 3 dim
p_amber    = "#D4D4D4" # zone 4 dim
p_amber_1  = "#B8B8B8" # zone 3
p_bg_dark  = "#0A0A0A" # near-black, used as fg on the lit segments
p_fg       = "#E8E8E8" # off-white idle text
