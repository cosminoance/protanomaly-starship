"$schema" = 'https://starship.rs/config-schema.json'

palette = "warm_accessible"

format = """
[░▒▓](fg:p_start)$os[](fg:p_start_1 bg:p_mid)$directory[](fg:p_mid bg:p_mid_1)[]\
(fg:p_mid_1 bg:p_end)$git_branch$git_status[](fg:p_end bg:p_end_1)[]\
(fg:p_end_1 bg:p_cyan)$nodejs\
$c$cpp$zig$cmake\
$terraform$gcloud$aws$golang\
$java$kotlin$scala\
$json$typescript\
$bun$rust$php$python[](fg:p_cyan bg:p_cyan_1)[]\
(fg:p_cyan_1 bg:p_amber)$time[](fg:p_amber bg:p_amber_1)[](fg:p_amber_1 bg:p_bg_dark)\
\n$character"""

[aws]
symbol = " "
style = "bg:p_cyan fg:p_bg_dark bold"
format = '[[ $symbol ($version) ](fg:p_bg_dark bg:p_cyan bold)]($style)'
[azure]
symbol = " "
style = "bg:p_cyan fg:p_bg_dark bold"
format = '[[ $symbol ($version) ](fg:p_bg_dark bg:p_cyan bold)]($style)'
[os]
style = "bg:p_start fg:p_bg_dark bold"
format = "[ $symbol]($style)"
disabled = false
[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:p_amber fg:p_bg_dark bold"
format = '[  $time ]($style)'
[battery]
full_symbol = "󰁹 "
